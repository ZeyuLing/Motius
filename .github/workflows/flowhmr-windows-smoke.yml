name: FlowHMR Windows compatibility smoke
on:
  push:
    paths:
      - 'blender_extension/motius_flowhmr/**'
      - 'tests/test_flowhmr_runtime_install.py'
      - 'tests/test_flowhmr_windows.py'
      - '.github/workflows/flowhmr-windows-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-compatibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Installer and simulated GPU checks
        run: python -m pytest tests/test_flowhmr_runtime_install.py tests/test_flowhmr_windows.py -q -k "windows or gpu_profile or nvidia_smi or cuda_probe"
