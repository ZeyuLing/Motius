[tool.setuptools.packages.find]
where = ["."]
include = ["motius*"]
namespaces = false

[tool.setuptools.package-data]
"motius.motion" = [
    "assets/*.npy",
    "retarget/_gmr/LICENSE",
    "retarget/_gmr/assets/unitree_g1/*.xml",
    "retarget/_gmr/ik_configs/*.json",
]
"motius.models.kimodo" = [
    "network/assets/skeletons/g1skel34/meshes/g1/*.STL",
]
"motius.models.tmr" = ["LICENSE"]
"motius.models.tm2t" = ["LICENSE"]
"motius.models.condmdi" = ["LICENSE"]
"motius.models.omnicontrol" = ["LICENSE", "assets/*.npy"]
"motius.trainers.sonic.vendor" = [
    "UPSTREAM_LICENSE",
    "THIRD_PARTY_NOTICES.txt",
    "README.md",
]
"motius.trainers.sonic.vendor.gear_sonic" = [
    "**/*.json",
    "**/*.pkl",
    "**/*.pt",
    "**/*.stl",
    "**/*.STL",
    "**/*.urdf",
    "**/*.xml",
    "**/*.yaml",
]
"motius.trainers.protomotions.vendor" = [
    "UPSTREAM_LICENSE.md",
    "THIRD_PARTY_NOTICES.txt",
    "README.md",
    "data/scripts/*.py",
    "examples/**/*.py",
    "pyroki/*.py",
]
"motius.trainers.protomotions.vendor.protomotions" = [
    "data/assets/checkerboard/*",
    "data/assets/mesh/G1/*",
    "data/assets/mesh/smpl/*",
    "data/assets/mjcf/*",
    "data/assets/urdf/**/*",
    "data/assets/usd/**/*",
]
"motius.trainers.beyondmimic.vendor" = [
    "README.md",
    "UPSTREAM_COMMIT",
    "UPSTREAM_LICENSE",
    "UPSTREAM_README.md",
    "scripts/**/*.py",
]
"motius.models.projflow" = ["ATTRIBUTIONS.md", "assets/*.npy"]
"motius.models.intergen" = ["NOTICE", "network/configs/*.yaml"]
"motius.models.intermask" = ["LICENSE"]
"motius.models.humanoid_gpt" = ["ATTRIBUTIONS.md"]
"motius.models.beyondmimic" = ["ATTRIBUTIONS.md"]
"motius.models.sonic" = ["ATTRIBUTIONS.md"]
"motius.models.protomotions" = ["ATTRIBUTIONS.md"]
"motius.models.motionclr" = ["LICENSE", "ATTRIBUTIONS.md"]
"motius.models.bailando" = ["LICENSE", "ATTRIBUTIONS.md"]
"motius.models.edge" = ["LICENSE", "ATTRIBUTIONS.md"]
"motius.models.maskcontrol" = ["ATTRIBUTIONS.md"]
"motius.models.tm2d" = ["ATTRIBUTIONS.md"]
"motius.models.unimumo" = ["ATTRIBUTIONS.md"]
"motius.models.prompthmr" = ["ATTRIBUTIONS.md"]
"motius.models.gem_smpl" = ["ATTRIBUTIONS.md"]
"motius.models.gem_smpl.vendor" = [
    "GENMO_LICENSE",
    "GENMO_ATTRIBUTIONS.md",
    "GVHMR_LICENSE",
    "configs/**/*.yaml",
]
"motius.models.gem_smpl.vendor.gem.utils.body_model" = ["*.pt", "*.pth"]
"motius.models.gem_x" = ["ATTRIBUTIONS.md"]
"motius.models.gem_x.vendor" = [
    "GEM_X_LICENSE",
    "GEM_X_ATTRIBUTIONS.md",
    "configs/**/*.yaml",
    "third_party/**/*.py",
    "third_party/**/*.md",
    "third_party/**/*LICENSE*",
]
"motius.models.gvhmr" = ["ATTRIBUTIONS.md"]
"motius.models.gvhmr.vendor" = ["GVHMR_LICENSE"]
"motius.models.gvhmr.vendor.hmr4d" = [
    "configs/*.yaml",
    "configs/*/*.yaml",
    "dataset/*/*.json",
    "dataset/*/*.pt",
    "dataset/*/*.txt",
    "network/hmr2/configs/*.yaml",
    "network/hmr2/configs/*.npz",
    "utils/body_model/*.json",
    "utils/body_model/*.npy",
    "utils/body_model/*.pth",
    "utils/body_model/*.pt",
]
"motius.simulators.mujoco" = [
    "ATTRIBUTIONS.md",
    "assets/unitree_g1/*.xml",
    "assets/unitree_g1/LICENSE",
]
"motius.models.ardy" = [
    "LICENSE",
    "ATTRIBUTIONS.md",
    "network/assets/skeletons/cskel27/*.p",
    "network/assets/skeletons/cskel27/*.npz",
    "network/assets/skeletons/g1skel34/*.p",
    "network/assets/skeletons/g1skel34/xml/*.xml",
]
"motius.models.motionbricks" = [
    "ATTRIBUTIONS.md",
    "network/assets/skeletons/g1/*.xml",
    "network/assets/skeletons/g1/meshes/*.STL",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: startup smoke tests for training and inference entry points",
    "gpu: tests that require CUDA-capable hardware and local pretrained checkpoints",
]
