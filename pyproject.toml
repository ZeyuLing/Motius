[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motius"
version = "0.1.0"
description = "A reproducible framework for human motion models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.20",
    "datasets>=2.0",
    "diffusers>=0.20",
    "huggingface_hub>=0.20",
    "mmengine>=0.7",
    "peft>=0.5",
    "safetensors>=0.3",
    "scipy>=1.9",
    "torch>=2.0",
    "transformers>=4.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
prism = [
    "einops>=0.6",
    "sentencepiece>=0.1",
]
motioncanvas = [
    "einops>=0.6",
    "mmcv-lite>=2.0,<2.2",
    "torchdiffeq>=0.2",
    "tqdm>=4.65",
]
vimogen = [
    "ftfy>=6.1",
    "regex>=2023.0",
    "sentencepiece>=0.1",
]
retarget = [
    "smplx>=0.1",
]
condmdi = [
