<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Tracking · All-case Viewer</title>
  <style>
    :root { --ink:#17231f; --muted:#63716b; --line:#dce3e0; --paper:#fff; --canvas:#f2f5f3; --teal:#087d72; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:13px/1.45 Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:0; }
    button,select,input { color:inherit; font:inherit; }
    .viewer { min-height:100vh; padding:14px; }
    .toolbar { display:grid; grid-template-columns:minmax(160px,.7fr) minmax(280px,2fr) auto; gap:10px; align-items:end; margin-bottom:10px; padding:11px; border:1px solid var(--line); border-radius:6px; background:var(--canvas); }
    label { display:block; margin-bottom:4px; color:var(--muted); font:600 9px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace; text-transform:uppercase; }
    select { width:100%; height:36px; padding:0 9px; border:1px solid #bdc9c4; border-radius:4px; background:#fff; }
    .transport { display:flex; gap:6px; }
    button { display:grid; width:36px; height:36px; place-items:center; border:1px solid #bdc9c4; border-radius:4px; background:#fff; cursor:pointer; font-weight:700; }
    button:hover { border-color:var(--teal); color:var(--teal); }
    .timeline { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; margin-bottom:10px; padding:0 2px; }
    input[type="range"] { width:100%; accent-color:var(--teal); }
    .frame { min-width:92px; color:var(--muted); font:600 10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace; text-align:right; }
    .case-meta { display:flex; justify-content:space-between; gap:12px; margin-bottom:10px; color:var(--muted); font-size:11px; }
    .case-meta strong { color:var(--ink); font-weight:650; overflow-wrap:anywhere; }
    .views { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .view { min-width:0; overflow:hidden; border:1px solid var(--line); border-radius:6px; background:#101713; }
    .view-head { display:flex; justify-content:space-between; gap:10px; min-height:42px; padding:10px 11px; border-bottom:1px solid #29352f; background:#17211d; color:#dce7e2; }
    .view-head strong { font-size:12px; }
    .view-head span { color:#98aaa2; font:500 9px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace; text-align:right; }
    canvas { display:block; width:100%; aspect-ratio:4/3; min-height:250px; }
    .status { min-height:43px; padding:8px 10px; border-top:1px solid #29352f; color:#aebdb7; font:500 9px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .status.error { color:#f0a997; }
    @media (max-width:900px) { .toolbar { grid-template-columns:1fr 1fr; } .transport { grid-column:1/-1; } .views { grid-template-columns:1fr; } canvas { min-height:320px; } }
    @media (max-width:560px) { .viewer { padding:9px; } .toolbar { grid-template-columns:1fr; } .transport { grid-column:auto; } canvas { min-height:260px; } .case-meta { flex-direction:column; gap:3px; } }
  </style>
  <script type="importmap">
    {"imports":{"three":"./three/three.module.js","three/addons/":"./three/"}}
  </script>
<!-- motius-surface:start -->
<link rel="stylesheet" href="../motius-surface.css" data-motius-surface>
<!-- motius-surface:end -->
<!-- motius-theme-color:start -->
<meta name="theme-color" content="#111827">
<!-- motius-theme-color:end -->
</head>
<body data-motius-page="viewer">
<!-- motius-skip-link:start -->
<a class="motius-skip-link" href="#main-content">Skip to main content</a>
<!-- motius-skip-link:end -->
  <main class="viewer" id="main-content" tabindex="-1">
    <div class="toolbar">
      <div><label for="split-select">Split</label><select id="split-select"></select></div>
      <div><label for="case-select">Case</label><select id="case-select"></select></div>
      <div class="transport">
        <button id="previous" title="Previous case" aria-label="Previous case">←</button>
        <button id="play" title="Pause" aria-label="Pause">Ⅱ</button>
        <button id="next" title="Next case" aria-label="Next case">→</button>
      </div>
    </div>
    <div class="case-meta"><strong id="case-label">Loading manifest…</strong><span>Drag to orbit · scroll to zoom</span></div>
    <div class="timeline"><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Animation timeline"><span class="frame" id="frame">0 / 0</span></div>
    <section class="views" id="views"></section>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/OrbitControls.js";
    import { STLLoader } from "three/addons/STLLoader.js";

    THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
    const COLORS = ["#9fb4c9", "#35b9a6", "#e0a05b"];
    const meshCache = new Map();
    const loader = new STLLoader();
    const views = [];
    let manifest;
    let robot;
    let filteredCases = [];
    let caseIndex = 0;
    let playing = true;
    let frame = 0;
    let fps = 30;
    let accumulator = 0;
    let lastTime = performance.now();
    let generation = 0;

    const splitSelect = document.getElementById("split-select");
    const caseSelect = document.getElementById("case-select");
    const caseLabel = document.getElementById("case-label");
    const scrub = document.getElementById("scrub");
    const frameLabel = document.getElementById("frame");
    const playButton = document.getElementById("play");

    const resolveBase = (base) => new URL(base, location.href);
    const assetUrl = (path) => new URL(path, resolveBase(manifest.asset_base_url)).href;
    const meshUrl = (path) => new URL(path.toLowerCase(), resolveBase(manifest.mesh_base_url)).href;

    function loadGeometry(path) {
      const url = meshUrl(path);
      if (!meshCache.has(url)) meshCache.set(url, loader.loadAsync(url));
      return meshCache.get(url);
    }

    function metricLine(metrics) {
      if (!metrics) return "Kinematic reference";
      return `${metrics.success_rate ? "SUCCESS" : "FAILED"} · completion ${(metrics.completion_rate * 100).toFixed(1)}% · local MPJPE ${metrics.local_mpjpe_mm.toFixed(2)} mm`;
    }

    class RobotView {
      constructor(column, color) {
        this.column = column;
        this.motion = null;
        this.bodyGroups = [];
        this.lastRoot = null;
        const root = document.createElement("article");
        root.className = "view";
        root.innerHTML = `<div class="view-head"><strong>${column.label}</strong><span>Unitree G1</span></div><canvas role="img" aria-label="Interactive 3D motion preview"></canvas><div class="status">Preparing G1 meshes…</div>`;
        document.getElementById("views").appendChild(root);
        this.canvas = root.querySelector("canvas");
        this.status = root.querySelector(".status");
        this.renderer = new THREE.WebGLRenderer({canvas:this.canvas, antialias:true, powerPreference:"high-performance"});
        this.renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.65));
        this.renderer.outputColorSpace = THREE.SRGBColorSpace;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x101713);
        this.camera = new THREE.PerspectiveCamera(42, 4 / 3, 0.01, 120);
        this.camera.up.set(0, 0, 1);
        this.controls = new OrbitControls(this.camera, this.canvas);
        this.controls.enableDamping = true;
        this.scene.add(new THREE.HemisphereLight(0xf8fffb, 0x25312c, 1.35));
        const key = new THREE.DirectionalLight(0xffffff, 1.6);
        key.position.set(3, -4, 7);
        this.scene.add(key);
        const grid = new THREE.GridHelper(16, 32, 0x405048, 0x26332d);
        grid.rotation.x = Math.PI / 2;
        this.scene.add(grid);
        this.robotGroup = new THREE.Group();
        this.scene.add(this.robotGroup);
        this.material = new THREE.MeshStandardMaterial({color, metalness:0.22, roughness:0.58});
      }

      async initialize(token) {
        const pending = [];
        robot.bodies.forEach((body, bodyIndex) => {
          const group = new THREE.Group();
          this.robotGroup.add(group);
          this.bodyGroups[bodyIndex] = group;
          for (const meshInfo of body.meshes || []) {
            pending.push(loadGeometry(meshInfo.file).then((geometry) => {
              if (token !== generation) return;
              const mesh = new THREE.Mesh(geometry, this.material);
              mesh.position.fromArray(meshInfo.pos || [0, 0, 0]);
              const q = meshInfo.quat || [1, 0, 0, 0];
              mesh.quaternion.set(q[1], q[2], q[3], q[0]);
              mesh.scale.fromArray(meshInfo.scale || [1, 1, 1]);
              group.add(mesh);
            }));
          }
        });
        await Promise.all(pending);
      }

      setUnavailable() {
        this.motion = null;
        this.robotGroup.visible = false;
        this.status.className = "status error";
        this.status.textContent = "No retained rollout for this reference.";
      }

      async load(asset, metrics, token) {
        if (!asset) { this.setUnavailable(); return; }
        this.robotGroup.visible = true;
        this.status.className = "status";
        this.status.textContent = "Loading compact body transforms…";
        const response = await fetch(assetUrl(asset.path));
        if (!response.ok) throw new Error(`${this.column.label} HTTP ${response.status}`);
        const buffer = await response.arrayBuffer();
        if (token !== generation) return;
        const values = new Float32Array(buffer);
        const expected = asset.frames * robot.body_count * robot.stride;
        if (values.length !== expected) throw new Error(`${this.column.label} frame payload ${values.length} != ${expected}`);
        this.motion = {values, frames:asset.frames, fps:asset.fps};
        this.lastRoot = null;
        this.applyFrame(0);
        this.status.textContent = `${asset.frames} frames · ${asset.fps} fps · ${metricLine(metrics)}`;
      }

      rootAt(index) {
        if (!this.motion) return null;
        const base = Math.min(index, this.motion.frames - 1) * robot.body_count * robot.stride;
        return new THREE.Vector3(this.motion.values[base], this.motion.values[base + 1], this.motion.values[base + 2]);
      }

      applyFrame(index) {
        if (!this.motion) return;
        const selected = Math.min(index, this.motion.frames - 1);
        const frameBase = selected * robot.body_count * robot.stride;
        for (let body = 0; body < this.bodyGroups.length; body += 1) {
          const base = frameBase + body * robot.stride;
          const group = this.bodyGroups[body];
          group.position.set(this.motion.values[base], this.motion.values[base + 1], this.motion.values[base + 2]);
          group.quaternion.set(this.motion.values[base + 4], this.motion.values[base + 5], this.motion.values[base + 6], this.motion.values[base + 3]);
        }
        const root = this.rootAt(selected);
        if (root && this.lastRoot) {
          const delta = root.clone().sub(this.lastRoot);
          this.camera.position.add(delta);
          this.controls.target.add(delta);
        }
        this.lastRoot = root;
      }

      frameCamera(points) {
        const box = new THREE.Box3();
        points.forEach((point) => box.expandByPoint(point));
        const center = box.getCenter(new THREE.Vector3());
        const span = Math.max(...box.getSize(new THREE.Vector3()).toArray(), 1.25);
        this.controls.target.copy(center);
        this.camera.position.set(center.x + span * 1.8, center.y - span * 1.8, center.z + span * 0.9);
        this.camera.lookAt(center);
        this.controls.update();
        this.lastRoot = this.rootAt(0);
      }

      render() {
        const width = this.canvas.clientWidth;
        const height = this.canvas.clientHeight;
        if (this.canvas.width !== Math.round(width * this.renderer.getPixelRatio()) || this.canvas.height !== Math.round(height * this.renderer.getPixelRatio())) {
          this.renderer.setSize(width, height, false);
          this.camera.aspect = width / Math.max(height, 1);
          this.camera.updateProjectionMatrix();
        }
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }
    }

    function cameraPoints(view) {
      const points = [];
      if (!view.motion) return points;
      for (let body = 0; body < robot.body_count; body += 1) {
        const base = body * robot.stride;
        points.push(new THREE.Vector3(view.motion.values[base], view.motion.values[base + 1], view.motion.values[base + 2]));
      }
      return points;
    }

    async function loadCase(index) {
      caseIndex = (index + filteredCases.length) % filteredCases.length;
      caseSelect.value = String(caseIndex);
      const item = filteredCases[caseIndex];
      caseLabel.textContent = `${item.split.replaceAll("_", " ")} · ${item.label}`;
      frame = 0;
      accumulator = 0;
      scrub.value = "0";
      const token = ++generation;
      await Promise.all(views.map((view) => view.load(item.assets[view.column.key], item.metrics?.[view.column.key], token).catch((error) => {
        view.setUnavailable();
        view.status.textContent = `Asset error: ${error.message}`;
        console.error(error);
      })));
      if (token !== generation) return;
      const reference = views.find((view) => view.column.key === "gt");
      const points = cameraPoints(reference);
      views.forEach((view) => { if (view.motion) view.frameCamera(points); });
      fps = item.assets.gt?.fps || 30;
      updateFrame();
    }

    function populateCases() {
      filteredCases = manifest.cases.filter((item) => item.split === splitSelect.value);
      caseSelect.innerHTML = filteredCases.map((item, index) => `<option value="${index}">${String(index + 1).padStart(3, "0")} · ${item.label}</option>`).join("");
      loadCase(0).catch((error) => { caseLabel.textContent = `Failed to load case: ${error.message}`; console.error(error); });
    }

    function totalFrames() {
      return Math.max(0, ...views.map((view) => view.motion?.frames || 0));
    }

    function updateFrame() {
      const total = totalFrames();
      views.forEach((view) => view.applyFrame(frame));
      scrub.value = total > 1 ? String(Math.round(frame / (total - 1) * 1000)) : "0";
      frameLabel.textContent = total ? `${frame + 1} / ${total}` : "0 / 0";
      views.forEach((view) => view.render());
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      const total = totalFrames();
      if (playing && total) {
        accumulator += dt * fps;
        while (accumulator >= 1) { frame = (frame + 1) % total; accumulator -= 1; }
        updateFrame();
      }
      views.forEach((view) => view.render());
    }

    Promise.all([
      fetch("manifest.json", {cache:"no-cache"}).then((response) => { if (!response.ok) throw new Error(`Manifest HTTP ${response.status}`); return response.json(); }),
      fetch("robot.json", {cache:"no-cache"}).then((response) => { if (!response.ok) throw new Error(`Robot HTTP ${response.status}`); return response.json(); }),
    ]).then(async ([manifestData, robotData]) => {
      manifest = manifestData;
      robot = robotData;
      manifest.splits.forEach((split) => { const option = document.createElement("option"); option.value = split.id; option.textContent = `${split.label} · ${split.population}`; splitSelect.appendChild(option); });
      manifest.columns.forEach((column, index) => views.push(new RobotView(column, COLORS[index % COLORS.length])));
      const token = generation;
      await Promise.all(views.map((view) => view.initialize(token)));
      splitSelect.addEventListener("change", () => {
        populateCases();
        window.parent.postMessage({type:"motius:viewer-split", split:splitSelect.value}, "*");
      });
      caseSelect.addEventListener("change", () => loadCase(Number(caseSelect.value)));
      document.getElementById("previous").addEventListener("click", () => loadCase(caseIndex - 1));
      document.getElementById("next").addEventListener("click", () => loadCase(caseIndex + 1));
      playButton.addEventListener("click", () => { playing = !playing; playButton.textContent = playing ? "Ⅱ" : "▶"; playButton.title = playing ? "Pause" : "Play"; playButton.setAttribute("aria-label", playButton.title); });
      scrub.addEventListener("input", () => { const total = totalFrames(); frame = total > 1 ? Math.round(Number(scrub.value) / 1000 * (total - 1)) : 0; accumulator = 0; updateFrame(); });
      populateCases();
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent || event.data?.type !== "motius:set-split") return;
        if (!manifest.splits.some((split) => split.id === event.data.split)) return;
        if (splitSelect.value === event.data.split) return;
        splitSelect.value = event.data.split;
        populateCases();
      });
      requestAnimationFrame(animate);
    }).catch((error) => { caseLabel.textContent = `Failed to load viewer: ${error.message}`; console.error(error); });
  </script>
</body>
</html>
