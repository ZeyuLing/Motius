<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Unitree G1 qualitative comparison for Motius text-to-motion evaluation.">
  <title>Unitree G1 Cases · Motius</title>
  <style>
    :root {
      --ink: #17211e;
      --muted: #64716c;
      --line: #d5ddd9;
      --paper: #ffffff;
      --canvas: #edf1ef;
      --green: #087a55;
      --dark: #121916;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0;
    }
    button, select, input { font: inherit; }
    .page { width: min(1500px, calc(100% - 32px)); margin: 0 auto; padding: 18px 0 36px; }
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 6px 6px 0 0;
      background: var(--paper);
    }
    h1 { margin: 0 0 5px; font-size: 24px; line-height: 1.15; }
    p { margin: 0; color: var(--muted); }
    .back { color: var(--green); font-weight: 700; text-decoration: none; white-space: nowrap; }
    .toolbar {
      display: grid;
      grid-template-columns: auto minmax(240px, 1fr) auto auto minmax(160px, 320px) auto;
      gap: 8px;
      align-items: center;
      padding: 10px;
      border: solid var(--line);
      border-width: 0 1px 1px;
      background: var(--paper);
    }
    button, select {
      min-height: 36px;
      border: 1px solid #c5d0cb;
      border-radius: 5px;
      background: #f7f9f8;
      color: var(--ink);
    }
    button { width: 38px; cursor: pointer; font-size: 17px; }
    button:hover { border-color: #82948c; }
    select { min-width: 0; padding: 0 10px; }
    input[type="range"] { width: 100%; accent-color: var(--green); }
    .frame { min-width: 82px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
    .prompt {
      min-height: 52px;
      padding: 14px 18px;
      border: solid var(--line);
      border-width: 0 1px 1px;
      background: #f8faf9;
      font-size: 15px;
      font-weight: 650;
    }
    .views {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      overflow: hidden;
      border: solid var(--line);
      border-width: 0 1px 1px;
      background: var(--line);
    }
    .view { min-width: 0; background: var(--dark); }
    .view-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      padding: 0 12px;
      background: var(--paper);
      color: var(--ink);
      font-weight: 750;
    }
    .view-head span:last-child { color: var(--muted); font-size: 11px; font-weight: 500; }
    canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #111713; }
    .status {
      min-height: 34px;
      padding: 8px 12px;
      background: #17211e;
      color: #a8b8b1;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .status.error { color: #ff968d; }
    @media (max-width: 900px) {
      .page { width: calc(100% - 18px); padding-top: 9px; }
      header { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: auto minmax(0, 1fr) auto auto; }
      .toolbar input, .frame { grid-column: span 2; }
      .views { grid-template-columns: 1fr; }
      canvas { aspect-ratio: 16 / 10; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>Text-to-Motion · Unitree G1</h1>
        <p>Canonical 30 fps robot meshes with synchronized playback and a shared initial camera.</p>
      </div>
      <a class="back" href="../">Back to metrics</a>
    </header>
    <section class="toolbar" aria-label="Case controls">
      <button id="previous" type="button" title="Previous case" aria-label="Previous case">←</button>
      <select id="case-select" aria-label="Case"></select>
      <button id="next" type="button" title="Next case" aria-label="Next case">→</button>
      <button id="play" type="button" title="Pause" aria-label="Pause">Ⅱ</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Frame">
      <span class="frame" id="frame">0 / 0</span>
    </section>
    <div class="prompt" id="prompt">Loading manifest…</div>
    <section class="views" id="views"></section>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { STLLoader } from "three/addons/loaders/STLLoader.js";

    THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
    const colors = ["#9fb4c9", "#e4a65f", "#43c59e"];
    const meshCache = new Map();
    const loader = new STLLoader();
    const views = [];
    let manifest;
    let caseIndex = 0;
    let playing = true;
    let frame = 0;
    let accumulator = 0;
    let lastTime = performance.now();
    let generation = 0;

    const select = document.getElementById("case-select");
    const prompt = document.getElementById("prompt");
    const scrub = document.getElementById("scrub");
    const frameLabel = document.getElementById("frame");
    const playButton = document.getElementById("play");

    function assetUrl(path) {
      return new URL(path, manifest.asset_base_url).href;
    }

    function meshUrl(path) {
      return new URL(path.toLowerCase(), manifest.mesh_base_url).href;
    }

    function loadGeometry(path) {
      const url = meshUrl(path);
      if (!meshCache.has(url)) meshCache.set(url, loader.loadAsync(url));
      return meshCache.get(url);
    }

    class RobotView {
      constructor(column, color) {
        this.column = column;
        this.data = null;
        this.bodyGroups = [];
        const root = document.createElement("article");
        root.className = "view";
        root.innerHTML = `
          <div class="view-head"><span>${column.label}</span><span>Unitree G1</span></div>
          <canvas></canvas>
          <div class="status">Waiting for case…</div>`;
        document.getElementById("views").appendChild(root);
        this.canvas = root.querySelector("canvas");
        this.status = root.querySelector(".status");
        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: true,
          powerPreference: "high-performance",
        });
        this.renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.7));
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x111713);
        this.camera = new THREE.PerspectiveCamera(42, 4 / 3, 0.01, 100);
        this.camera.up.set(0, 0, 1);
        this.controls = new OrbitControls(this.camera, this.canvas);
        this.controls.enableDamping = true;
        this.scene.add(new THREE.HemisphereLight(0xffffff, 0x26332e, 1.1));
        const key = new THREE.DirectionalLight(0xffffff, 1.45);
        key.position.set(3, -3, 6);
        this.scene.add(key);
        const grid = new THREE.GridHelper(12, 24, 0x34433d, 0x202b27);
        grid.rotation.x = Math.PI / 2;
        this.scene.add(grid);
        this.robot = new THREE.Group();
        this.scene.add(this.robot);
        this.material = new THREE.MeshStandardMaterial({
          color,
          metalness: 0.18,
          roughness: 0.64,
        });
      }

      clear() {
        this.robot.clear();
        this.bodyGroups = [];
        this.data = null;
      }

      async load(url, token, cameraFrame) {
        this.clear();
        this.status.className = "status";
        this.status.textContent = "Loading robot frames…";
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (token !== generation) return;
          if (!Array.isArray(data.frames) || !Array.isArray(data.bodies)) {
            throw new Error("Invalid robot_frames payload");
          }
          this.data = data;
          const pending = [];
          data.bodies.forEach((body, bodyIndex) => {
            const group = new THREE.Group();
            this.robot.add(group);
            this.bodyGroups[bodyIndex] = group;
            for (const meshInfo of body.meshes || []) {
              pending.push(
                loadGeometry(meshInfo.file).then((geometry) => {
                  if (token !== generation) return;
                  const mesh = new THREE.Mesh(geometry, this.material);
                  if (meshInfo.pos) mesh.position.fromArray(meshInfo.pos);
                  if (meshInfo.quat) {
                    const q = meshInfo.quat;
                    mesh.quaternion.set(q[1], q[2], q[3], q[0]);
                  }
                  group.add(mesh);
                })
              );
            }
          });
          await Promise.all(pending);
          if (token !== generation) return;
          this.applyFrame(0);
          this.frameCamera(cameraFrame || data.frames[0]);
          this.status.textContent = `${data.frames.length} frames · ${data.fps || 30} fps`;
        } catch (error) {
          this.status.className = "status error";
          this.status.textContent = `Failed to load: ${error.message}`;
          console.error(error);
        }
      }

      frameCamera(sourceFrame) {
        const points = (sourceFrame?.body_pos || []).filter(
          (value) => Array.isArray(value) && value.length >= 3
        );
        if (!points.length) return;
        const box = new THREE.Box3();
        for (const value of points) box.expandByPoint(new THREE.Vector3(...value));
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const span = Math.max(size.x, size.y, size.z, 1.2);
        this.controls.target.copy(center);
        this.camera.position.set(
          center.x + span * 1.8,
          center.y - span * 1.8,
          center.z + span * 0.9
        );
        this.camera.lookAt(center);
        this.controls.update();
      }

      applyFrame(index) {
        if (!this.data?.frames?.length) return;
        const current = this.data.frames[Math.min(index, this.data.frames.length - 1)];
        for (let i = 0; i < this.bodyGroups.length; i += 1) {
          const group = this.bodyGroups[i];
          const position = current.body_pos?.[i];
          const rotation = current.body_quat?.[i];
          if (position) group.position.fromArray(position);
          if (rotation) {
            group.quaternion.set(rotation[1], rotation[2], rotation[3], rotation[0]);
          }
        }
      }

      render() {
        const width = this.canvas.clientWidth;
        const height = this.canvas.clientHeight;
        if (this.canvas.width !== width || this.canvas.height !== height) {
          this.renderer.setSize(width, height, false);
          this.camera.aspect = width / Math.max(height, 1);
          this.camera.updateProjectionMatrix();
        }
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }
    }

    async function loadCase(index) {
      caseIndex = (index + manifest.cases.length) % manifest.cases.length;
      select.value = String(caseIndex);
      const item = manifest.cases[caseIndex];
      prompt.textContent = item.prompt;
      frame = 0;
      accumulator = 0;
      scrub.value = "0";
      const token = ++generation;
      const firstResponse = await fetch(assetUrl(item.assets.gt));
      if (!firstResponse.ok) throw new Error(`GT HTTP ${firstResponse.status}`);
      const firstData = await firstResponse.json();
      if (token !== generation) return;
      const cameraFrame = firstData.frames?.[0];
      const loads = views.map((view) => {
        const path = item.assets[view.column.key];
        if (view.column.key === "gt") {
          const blob = new Blob([JSON.stringify(firstData)], {type: "application/json"});
          const url = URL.createObjectURL(blob);
          return view.load(url, token, cameraFrame).finally(() => URL.revokeObjectURL(url));
        }
        return view.load(assetUrl(path), token, cameraFrame);
      });
      await Promise.all(loads);
      updateFrame();
    }

    function updateFrame() {
      const total = Math.max(0, ...views.map((view) => view.data?.frames?.length || 0));
      for (const view of views) view.applyFrame(frame);
      scrub.value = total > 1 ? String(Math.round((frame / (total - 1)) * 1000)) : "0";
      frameLabel.textContent = total ? `${frame + 1} / ${total}` : "0 / 0";
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      const total = Math.max(0, ...views.map((view) => view.data?.frames?.length || 0));
      if (playing && total) {
        accumulator += dt * 30;
        while (accumulator >= 1) {
          frame = (frame + 1) % total;
          accumulator -= 1;
        }
        updateFrame();
      }
      for (const view of views) view.render();
    }

    fetch("manifest.json")
      .then((response) => {
        if (!response.ok) throw new Error(`Manifest HTTP ${response.status}`);
        return response.json();
      })
      .then((data) => {
        manifest = data;
        data.columns.forEach((column, index) => {
          views.push(new RobotView(column, colors[index % colors.length]));
        });
        data.cases.forEach((item, index) => {
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = `${String(index + 1).padStart(2, "0")} · ${item.prompt}`;
          select.appendChild(option);
        });
        select.addEventListener("change", () => loadCase(Number(select.value)));
        document.getElementById("previous").addEventListener("click", () => loadCase(caseIndex - 1));
        document.getElementById("next").addEventListener("click", () => loadCase(caseIndex + 1));
        playButton.addEventListener("click", () => {
          playing = !playing;
          playButton.textContent = playing ? "Ⅱ" : "▶";
          playButton.title = playing ? "Pause" : "Play";
          playButton.setAttribute("aria-label", playButton.title);
        });
        scrub.addEventListener("input", () => {
          const total = Math.max(0, ...views.map((view) => view.data?.frames?.length || 0));
          frame = total > 1 ? Math.round((Number(scrub.value) / 1000) * (total - 1)) : 0;
          accumulator = 0;
          updateFrame();
        });
        loadCase(0).catch((error) => {
          prompt.textContent = `Failed to load case: ${error.message}`;
          console.error(error);
        });
        requestAnimationFrame(animate);
      })
      .catch((error) => {
        prompt.textContent = `Failed to load viewer: ${error.message}`;
        console.error(error);
      });
  </script>
</body>
</html>
