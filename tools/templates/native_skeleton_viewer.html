<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motius native skeleton preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: #17231e;
      background: #f4f6f8;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    main, .tile, .canvas-host { position: absolute; inset: 0; }
    .tile { overflow: hidden; }
    .method {
      position: absolute;
      z-index: 3;
      top: 14px;
      left: 14px;
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 4px;
      color: #17231e;
      background: rgba(255, 255, 255, .9);
      font-size: 12px;
      font-weight: 750;
      line-height: 1;
      pointer-events: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .player {
      position: absolute;
      z-index: 4;
      right: 16px;
      bottom: 16px;
      left: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 88px;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border: 1px solid rgba(23, 35, 30, .12);
      border-radius: 6px;
      background: rgba(255, 255, 255, .92);
    }
    input { width: 100%; accent-color: #315f9d; }
    .time {
      color: #65716b;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main>
    <div class="tile" data-load-state="loading">
      <div class="method"></div>
      <div class="canvas-host"></div>
    </div>
    <div class="player">
      <input id="timeline" type="range" min="0" max="1" value="0" step="1">
      <span id="time" class="time">0.00 / 0.00 s</span>
    </div>
    <span id="case-id" hidden></span>
  </main>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const manifest = await fetch("manifest.json").then(response => {
      if (!response.ok) throw new Error(`manifest: ${response.status}`);
      return response.json();
    });
    const item = manifest.cases[0];
    document.querySelector(".method").textContent = manifest.method;
    document.querySelector("#case-id").textContent = item.case_id;
    const response = await fetch(item.skeleton.positions_file);
    if (!response.ok) throw new Error(`positions: ${response.status}`);
    const positions = new Float32Array(await response.arrayBuffer());
    const host = document.querySelector(".canvas-host");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f6f8);
    scene.fog = new THREE.Fog(0xf4f6f8, 14, 34);
    const center = new THREE.Vector3(...item.skeleton.center);
    const span = Math.max(2.8, item.skeleton.horizontal_span);
    const camera = new THREE.PerspectiveCamera(32, 1, .05, 80);
    camera.position.set(
      center.x + span * .9,
      Math.max(1.45, item.skeleton.height * .72),
      center.z + span * 1.35
    );
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance",
      preserveDrawingBuffer: true,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    host.append(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(center.x, item.skeleton.height * .48, center.z);
    controls.maxPolarAngle = Math.PI * .49;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x687487, 2.2));
    const key = new THREE.DirectionalLight(0xffffff, 3.6);
    key.position.set(center.x - 3.5, 6.5, center.z + 5.5);
    key.castShadow = true;
    scene.add(key);

    const floorSize = Math.max(11, span * 2.3);
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(floorSize, floorSize),
      new THREE.MeshStandardMaterial({
        color: 0xf8faf9,
        roughness: 1,
        metalness: 0,
      })
    );
    floor.position.set(center.x, 0, center.z);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const grid = new THREE.GridHelper(
      floorSize,
      Math.max(24, Math.round(floorSize * 4)),
      0xa8b6af,
      0xd8dfdb
    );
    grid.position.set(center.x, .002, center.z);
    grid.material.opacity = .38;
    grid.material.transparent = true;
    scene.add(grid);

    if (item.trajectory?.length > 1) {
      const points = item.trajectory.map(value =>
        new THREE.Vector3(value[0], value[1], value[2])
      );
      const trajectoryMaterial = new THREE.MeshBasicMaterial({
        color: 0xd95f02,
      });
      const trajectoryCurve = new THREE.CatmullRomCurve3(
        points,
        false,
        "centripetal"
      );
      const trajectory = new THREE.Mesh(
        new THREE.TubeGeometry(
          trajectoryCurve,
          Math.max(16, points.length * 2),
          .012,
          8,
          false
        ),
        trajectoryMaterial
      );
      scene.add(trajectory);
    }

    const colors = [0x29a6a1, 0xd95f43];
    const jointGeometry = new THREE.SphereGeometry(.035, 12, 8);
    const boneGeometry = new THREE.CylinderGeometry(.022, .022, 1, 10);
    const people = Array.from(
      {length: item.skeleton.people},
      (_, person) => {
        const material = new THREE.MeshStandardMaterial({
          color: colors[person % colors.length],
          roughness: .66,
          metalness: .01,
        });
        const joints = Array.from(
          {length: item.skeleton.joints},
          () => {
            const mesh = new THREE.Mesh(jointGeometry, material);
            mesh.castShadow = true;
            scene.add(mesh);
            return mesh;
          }
        );
        const bones = item.skeleton.parents.map((parent, joint) => {
          if (parent < 0) return null;
          const mesh = new THREE.Mesh(boneGeometry, material);
          mesh.castShadow = true;
          scene.add(mesh);
          return {mesh, parent, joint};
        }).filter(Boolean);
        return {joints, bones};
      }
    );
    const up = new THREE.Vector3(0, 1, 0);
    const start = new THREE.Vector3();
    const end = new THREE.Vector3();
    const focus = new THREE.Vector3();
    const cameraOffset = new THREE.Vector3();
    const rootJoint = Math.max(
      0,
      item.skeleton.parents.findIndex(parent => parent < 0)
    );
    function setFrame(frame) {
      const value = Math.max(0, Math.min(item.frames - 1, Number(frame)));
      for (let person = 0; person < people.length; person += 1) {
        for (let joint = 0; joint < item.skeleton.joints; joint += 1) {
          const offset =
            ((value * item.skeleton.people + person) *
              item.skeleton.joints + joint) * 3;
          people[person].joints[joint].position.fromArray(positions, offset);
        }
        for (const bone of people[person].bones) {
          start.copy(people[person].joints[bone.parent].position);
          end.copy(people[person].joints[bone.joint].position);
          bone.mesh.position.copy(start).add(end).multiplyScalar(.5);
          const length = start.distanceTo(end);
          bone.mesh.scale.set(1, length, 1);
          bone.mesh.quaternion.setFromUnitVectors(
            up,
            end.clone().sub(start).normalize()
          );
        }
      }
      cameraOffset.copy(camera.position).sub(controls.target);
      focus.set(0, item.skeleton.height * .48, 0);
      for (const person of people) {
        focus.x += person.joints[rootJoint].position.x;
        focus.z += person.joints[rootJoint].position.z;
      }
      focus.x /= people.length;
      focus.z /= people.length;
      controls.target.copy(focus);
      camera.position.copy(focus).add(cameraOffset);
      controls.update();
      time.textContent =
        `${(value / item.fps).toFixed(2)} / ` +
        `${(item.frames / item.fps).toFixed(2)} s`;
    }
    const timeline = document.querySelector("#timeline");
    const time = document.querySelector("#time");
    timeline.max = String(item.frames - 1);
    timeline.addEventListener("input", () => setFrame(timeline.value));
    function resize() {
      const width = host.clientWidth;
      const height = host.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / Math.max(1, height);
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();
    setFrame(0);
    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
    await new Promise(resolve =>
      requestAnimationFrame(() => requestAnimationFrame(resolve))
    );
    document.querySelector(".tile").dataset.loadState = "ready";
  </script>
</body>
</html>
